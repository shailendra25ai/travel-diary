<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Browser tab icon -->
    <link rel="icon" type="image/png" href="/logo-icon.png" />

    <!-- iOS Home Screen Icon (when "Add to Home Screen" is used on iPhone) -->
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/logo-icon.png" />

    <!-- Android / PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a1a" />

    <!-- Make the app feel native when added to iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mosaic" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Mosaic" />

    <title>Mosaic — Many pieces. One unforgettable trip.</title>
    <meta name="description" content="Capture trips together. Share them beautifully. Relive them forever. Mosaic turns your group's photos and stories into shareable AI-written trip recaps." />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mosaic — Many pieces. One unforgettable trip." />
    <meta property="og:description" content="Capture trips together. Share them beautifully. Relive them forever." />
    <meta property="og:image" content="/logo-stacked.png" />
    <meta property="og:site_name" content="Mosaic" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mosaic — Many pieces. One unforgettable trip." />
    <meta name="twitter:description" content="Capture trips together. Share them beautifully. Relive them forever." />
    <meta name="twitter:image" content="/logo-stacked.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
